name: Fullstack fixture
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/fullstack
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://fixture:fixture-local-only@127.0.0.1:5432/tasks
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: tasks
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d tasks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:db
      - run: npm run test:e2e
