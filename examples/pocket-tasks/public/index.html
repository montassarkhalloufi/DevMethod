<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Tasks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">A LITTLE SPACE TO GET THINGS DONE</span>
        <h1>Pocket Tasks<span aria-hidden="true">.</span></h1>
        <p>Clear your head. Start with one small thing.</p>
      </header>
      <section class="workspace" aria-label="Your tasks">
        <form id="add-form">
          <label for="new-title">What needs doing?</label>
          <div class="add-row">
            <input
              id="new-title"
              name="title"
              maxlength="120"
              required
              placeholder="e.g. Plan tomorrow’s walk"
              autocomplete="off"
            /><button type="submit" class="primary">Add task</button>
          </div>
        </form>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All</button
            ><button type="button" data-filter="active" aria-pressed="false">Active</button
            ><button type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <span id="count">0 tasks</span>
        </div>
        <p id="status" role="status" aria-live="polite">Loading tasks…</p>
        <div id="error" role="alert" hidden></div>
        <button id="retry" type="button" hidden>Reload tasks</button>
        <ul id="tasks" aria-label="Task list"></ul>
        <p id="empty" hidden>No tasks yet. Add your first above.</p>
      </section>
      <footer>Stored on this computer. One task at a time.</footer>
    </main>
  </body>
</html>
